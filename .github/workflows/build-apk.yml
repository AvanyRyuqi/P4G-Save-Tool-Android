name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test save-file logic
        run: node --test tests/core.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK (fixed signing key, versionCode = 100 + run number)
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk P4G-Save-Tool.apk

      - uses: actions/upload-artifact@v4
        with:
          name: P4G-Save-Tool-apk
          path: P4G-Save-Tool.apk

      # Download from the phone: repo > Releases > latest > P4G-Save-Tool.apk, then install over the old app.
      - name: Publish release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" P4G-Save-Tool.apk \
            --title "P4G Save Tool build ${{ github.run_number }}" \
            --notes "Commit ${GITHUB_SHA::7}. Install over the previous version (same signing key)." \
            --latest
